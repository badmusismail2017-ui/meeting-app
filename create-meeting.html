<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Create Meeting | MeetAlarm</title>

    <link
            rel="stylesheet"
            href="css/meeting.css">

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="meeting-page">

    <div class="meeting-card">

        <div class="meeting-header">

            <h1 id="pageTitle">

                Create Meeting

            </h1>

            <p>

                Schedule your meetings and never miss an important event.

            </p>

        </div>

        <form id="meetingForm">

            <div class="form-group">

                <label for="title">

                    Meeting Title

                </label>

                <input
                        id="title"
                        type="text"
                        placeholder="Enter meeting title"
                        required>

            </div>

            <div class="form-group">

                <label for="description">

                    Description

                </label>

                <textarea
                        id="description"
                        rows="5"
                        placeholder="Enter meeting description"></textarea>

            </div>

            <div class="form-group">

                <label for="date">

                    Meeting Date

                </label>

                <input
                        id="date"
                        type="date"
                        required>

            </div>

            <div class="form-group">

                <label for="time">

                    Meeting Time

                </label>

                <input
                        id="time"
                        type="time"
                        required>

            </div>

            <div class="button-group">

                <button
                        type="submit"
                        class="save-btn">

                    Save Meeting

                </button>

                <button
                        type="button"
                        id="cancelBtn"
                        class="cancel-btn">

                    Cancel

                </button>

            </div>

        </form>

    </div>

</div>

<script type="module" src="js/meeting.js"></script>

</body>

</html>
