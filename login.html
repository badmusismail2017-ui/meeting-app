<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MeetAlarm | Login</title>

<link rel="stylesheet" href="css/auth.css">

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="left-side">

<div class="overlay">

<h1>MeetAlarm</h1>

<p>

Never miss another meeting.

Manage meetings,

receive reminders,

and stay productive.

</p>

</div>

</div>

<div class="right-side">

<form id="loginForm">

<h2>Welcome Back 👋</h2>

<p class="subtitle">

Login to continue

</p>

<div class="input-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>

<div class="input-group">

<label>Password</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Enter password"
required>

<i
class="fa-solid fa-eye"
id="togglePassword"></i>

</div>

</div>

<div class="remember">

<label>

<input type="checkbox">

Remember Me

</label>

 <a href="javascript:void(0)">
    Forgot Password?
 </a>

</div>

<button
type="submit"
class="login-btn">

Login

</button>

<p class="register-text">

Don't have an account?

<a href="register.html">

Create Account

</a>

</p>

</form>

</div>

</div>

<script type="module" src="js/auth.js"></script>

</body>

</html>
